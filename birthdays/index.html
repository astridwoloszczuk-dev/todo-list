<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#db2777" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Birthdays</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:     #db2777;
      --pink-lt:  #fce7f3;
      --pink-dk:  #be185d;
      --amber:    #d97706;
      --green:    #16a34a;
      --green-lt: #dcfce7;
      --gray-50:  #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-900: #111827;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Header ── */
    header {
      background: var(--pink);
      color: white;
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }
    .app-title { font-size: 1.05rem; font-weight: 700; }
    #user-badge {
      font-size: .8rem;
      background: rgba(255,255,255,.2);
      border: none; color: white;
      padding: 4px 10px; border-radius: 999px;
      cursor: pointer; max-width: 110px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #user-badge:hover { background: rgba(255,255,255,.3); }

    /* ── Main content ── */
    main { flex: 1; padding: 12px 16px 32px; }

    /* ── Add form ── */
    .add-form {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .add-form input, .add-form select {
      width: 100%;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 1rem;
      outline: none;
      font-family: inherit;
      background: var(--gray-50);
    }
    .add-form input:focus, .add-form select:focus {
      border-color: var(--pink);
      background: white;
    }
    .date-row { display: flex; gap: 8px; }
    .date-row select { flex: 1; }

    .remind-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .remind-label { font-size: .72rem; color: var(--gray-400); white-space: nowrap; }
    .remind-pills { display: flex; gap: 5px; flex-wrap: wrap; }
    .remind-pill {
      height: 28px; padding: 0 10px;
      border-radius: 999px; border: none;
      font-size: .72rem; font-weight: 700;
      color: white; cursor: pointer;
      opacity: 0.35; transition: opacity .15s;
    }
    .remind-pill.on { opacity: 1; }

    #add-btn {
      background: var(--pink);
      color: white; border: none; border-radius: 10px;
      padding: 11px; font-size: .95rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    #add-btn:hover { background: var(--pink-dk); }

    /* ── Birthday cards ── */
    .bday-empty {
      color: var(--gray-400); font-size: .88rem;
      text-align: center; padding: 48px 0;
    }

    .bday-card {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      border-left: 4px solid transparent;
    }
    .bday-card.today    { border-left-color: var(--pink); }
    .bday-card.tomorrow { border-left-color: var(--amber); }

    .bday-info { flex: 1; min-width: 0; }
    .bday-name { font-size: .95rem; font-weight: 600; }
    .bday-meta { font-size: .78rem; color: var(--gray-400); margin-top: 2px; }

    .bday-countdown {
      font-size: .78rem; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; white-space: nowrap;
    }
    .bday-countdown.today  { background: var(--pink-lt); color: var(--pink); }
    .bday-countdown.soon   { background: #fef3c7; color: var(--amber); }
    .bday-countdown.normal { background: var(--gray-100); color: var(--gray-600); }

    .bday-ack-btn {
      background: var(--green); color: white;
      border: none; border-radius: 8px;
      padding: 6px 12px; font-size: .8rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .bday-ack-btn.acked { background: var(--gray-200); color: var(--gray-400); cursor: default; }

    .bday-del-btn {
      width: 28px; height: 28px; border-radius: 6px;
      border: none; background: transparent; color: var(--gray-400);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .15s;
    }
    .bday-card:hover .bday-del-btn { opacity: 1; }
    .bday-del-btn:hover { background: #fee2e2; color: #dc2626; }

    /* ── User modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 24px;
    }
    .modal-backdrop.hidden { display: none; }
    .modal {
      background: white; border-radius: 16px; padding: 28px 24px;
      width: 100%; max-width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .modal p  { font-size: .85rem; color: var(--gray-600); margin-bottom: 16px; }
    .modal-names { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .modal-name-btn {
      flex: 1; min-width: 80px;
      border: 1.5px solid var(--gray-200); border-radius: 10px;
      padding: 8px; font-size: .9rem; font-weight: 500;
      background: white; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .modal-name-btn:hover { border-color: var(--pink); background: var(--pink-lt); color: var(--pink); }
    .modal-divider { text-align: center; font-size: .8rem; color: var(--gray-400); margin-bottom: 12px; }
    .modal input {
      width: 100%; border: 1.5px solid var(--gray-200); border-radius: 10px;
      padding: 10px 14px; font-size: 1rem; outline: none; margin-bottom: 12px;
      font-family: inherit;
    }
    .modal input:focus { border-color: var(--pink); }
    .modal .save-btn {
      width: 100%; background: var(--pink); color: white;
      border: none; border-radius: 10px; padding: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .modal .save-btn:hover { background: var(--pink-dk); }
  </style>
</head>
<body>

  <header>
    <div class="app-title">🎂 Birthdays</div>
    <button id="user-badge">Set name</button>
  </header>

  <main>
    <div class="add-form">
      <input id="name-input" type="text" placeholder="Name…" autocomplete="off" />
      <div class="date-row">
        <select id="day-input">
          <option value="">Day</option>
        </select>
        <select id="month-input">
          <option value="">Month</option>
          <option value="01">January</option><option value="02">February</option>
          <option value="03">March</option><option value="04">April</option>
          <option value="05">May</option><option value="06">June</option>
          <option value="07">July</option><option value="08">August</option>
          <option value="09">September</option><option value="10">October</option>
          <option value="11">November</option><option value="12">December</option>
        </select>
      </div>
      <input id="notes-input" type="text" placeholder="Notes (optional)" autocomplete="off" />
      <div class="remind-row">
        <span class="remind-label">Remind</span>
        <div class="remind-pills" id="remind-pills"></div>
      </div>
      <button id="add-btn">Add Birthday</button>
    </div>

    <div id="bday-list"></div>
  </main>

  <div id="user-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h2>Who are you? 👋</h2>
      <p>Tap your name or type it below.</p>
      <div class="modal-names" id="modal-names"></div>
      <div class="modal-divider">or type a name</div>
      <input id="user-name-input" type="text" placeholder="Your name" maxlength="30" />
      <button class="save-btn" id="user-save-btn">Save</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
